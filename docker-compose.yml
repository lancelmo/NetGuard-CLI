version: '3.8'

services:
  netguard:
    build: .
    image: netguard-web:v2.0
    container_name: netguard_container
    # Compartilha a placa de rede física do host com o contêiner —
    # necessário para o Scapy (ARP scan e sniffer) enxergar o tráfego real.
    network_mode: "host"
    # Permissão de administrador (root) no contêiner, exigida pelo
    # Scapy para varredura ARP/porta e captura de pacotes.
    privileged: true
    stdin_open: true
    tty: true
    volumes:
      - .:/app