<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}NetGuard{% endblock %} · NetGuard</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
  {% block extra_head %}{% endblock %}
</head>
<body>

<div class="ng-shell">
  <aside class="ng-sidebar">
    <div class="ng-brand">
      <span class="ng-brand-dot"></span>
      <span class="ng-brand-text">
        NetGuard
        <small>Cyber Defense</small>
      </span>
    </div>

    <nav class="ng-nav">
      <a href="/painel" class="ng-nav-link {% if active == 'scan' %}active{% endif %}">
        <span class="ng-nav-icon">◎</span> Varredura
      </a>
      <a href="/painel/dispositivos" class="ng-nav-link {% if active == 'devices' %}active{% endif %}">
        <span class="ng-nav-icon">▤</span> Dispositivos
      </a>
      <a href="/painel/relatorios" class="ng-nav-link {% if active == 'reports' %}active{% endif %}">
        <span class="ng-nav-icon">▦</span> Relatórios
      </a>
      <a href="/painel/sniffer" class="ng-nav-link {% if active == 'sniffer' %}active{% endif %}">
        <span class="ng-nav-icon">◈</span> Sniffer
      </a>
    </nav>

    <div class="ng-sidebar-footer">
      <div class="ng-user-chip">
        <span class="mono" id="ng-user-chip-name">—</span>
        <button class="ng-logout-btn" onclick="ngLogout()">sair</button>
      </div>
    </div>
  </aside>

  <main class="ng-main">
    {% block content %}{% endblock %}
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/auth.js"></script>
<script>ngRequireAuth();</script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
